# Forgejo Actions: build the Docker image on every `vX.Y.Z` tag and push it to
# a container registry. Configure per instance:
#
#   vars.REGISTRY   registry host, e.g. registry.example.com
#   vars.IMAGE      full image path, e.g. registry.example.com/<owner>/cobweb
#   secrets.RELEASE_TOKEN   token with package-write on that registry
#
# Runner: label `docker`, with a working Docker daemon in the job container
# (socket mount or DinD). No JS actions — the `docker:27-cli` image is Alpine
# with no Node.js, so checkout is a plain git clone + submodule init
# (vendor/novnc is a public GitHub submodule the Dockerfile copies in).
#
# GitHub Actions CI (fmt/clippy/test/cargo-deny/multi-arch) is tracked
# separately.

name: release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE: ${{ vars.IMAGE }}

jobs:
  image:
    runs-on: docker
    container:
      image: docker:27-cli

    steps:
      - name: Tools
        run: apk add --no-cache git curl jq

      - name: Docker daemon reachable?
        run: |
          if ! docker version >/dev/null 2>&1; then
            echo "::error::this runner's job container has no working Docker daemon (need a socket mount or DinD)"
            exit 1
          fi

      - name: Derive version
        id: v
        run: |
          tag="${{ github.ref_name }}"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag + submodules (git, no JS action)
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          server='${{ github.server_url }}'
          host="${server#https://}"
          auth="https://${{ github.actor }}:${RELEASE_TOKEN}@${host}"
          tag='${{ github.ref_name }}'

          git config --global --add safe.directory '*'
          mkdir -p /work && cd /work

          git init -q cobweb && cd cobweb
          git remote add origin "${auth}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout -q "refs/tags/${tag}"
          # vendor/novnc — public GitHub submodule, no auth
          git submodule update --init --recursive --depth 1

      - name: Registry login
        run: |
          printf '%s' '${{ secrets.RELEASE_TOKEN }}' \
            | docker login "$REGISTRY" -u '${{ github.actor }}' --password-stdin

      - name: Build
        run: |
          docker build \
            -t "$IMAGE:${{ steps.v.outputs.name }}" \
            -t "$IMAGE:latest" \
            /work/cobweb

      - name: Push
        run: |
          docker push "$IMAGE:${{ steps.v.outputs.name }}"
          docker push "$IMAGE:latest"

      - name: Forgejo release notes
        run: |
          set -eu
          api='${{ github.server_url }}/api/v1/repos/${{ github.repository }}'
          tag='${{ github.ref_name }}'
          hdr="Authorization: token ${{ secrets.RELEASE_TOKEN }}"
          ver='${{ steps.v.outputs.name }}'
          body=$(printf 'Docker image:\n\n```\ndocker pull %s:%s\n```\n\nAlso published as `%s:latest`.\n' "$IMAGE" "$ver" "$IMAGE")
          rel_id=$(curl -sf -H "$hdr" "$api/releases/tags/${tag}" | jq -r '.id // empty' || true)
          if [ -z "$rel_id" ]; then
            curl -sf -H "$hdr" -H 'Content-Type: application/json' -X POST "$api/releases" \
              -d "$(jq -nc --arg t "$tag" --arg b "$body" '{tag_name:$t, name:$t, body:$b}')" \
              >/dev/null
            echo "created release $tag"
          else
            echo "release $tag already exists (id $rel_id) — left as is"
          fi
