name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # fmt + clippy + tests. The browser (Chromium) and VNC (x11vnc) integration
  # tests self-skip when those binaries are absent, so CI doesn't install them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: BoringSSL build deps (wreq TLS backend)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        # The runner ships google-chrome-stable but its headless launch can't
        # bring CDP up in this sandbox — the browser/VNC integration tests
        # self-skip on this flag. They run for real in the devcontainer.
        run: cargo test --all-features --no-fail-fast
        env:
          COBWEB_SKIP_BROWSER_TESTS: "1"

  # Licenses / advisories / bans / sources.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # End-to-end Dockerfile sanity (amd64 only, no push). Guards against a build
  # regression before a release tag hits the multi-arch job.
  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - name: build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
