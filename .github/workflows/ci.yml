name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # fmt + clippy + tests (the Chromium tests run in the `browser` job).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: BoringSSL build deps (wreq TLS backend)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        # The runner's google-chrome-stable can't bring CDP up in its sandbox;
        # the real-Chromium tests self-skip on this flag here and run in the
        # `browser` job instead.
        run: cargo test --all-features --no-fail-fast
        env:
          COBWEB_SKIP_BROWSER_TESTS: "1"

  # The CDP tests (SSRF guard, egress proxy, iframes, storage state) against
  # Debian's Chromium — the same browser the image ships.
  browser:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Chromium + BoringSSL build deps
        run: apt-get update && apt-get install -y --no-install-recommends chromium fonts-liberation cmake clang
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: CDP tests
        run: cargo test --test cdp
        env:
          CC: clang
          CXX: clang++

  # Licenses / advisories / bans / sources.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  # End-to-end Dockerfile sanity (amd64 only, no push). Guards against a build
  # regression before a release tag hits the multi-arch job.
  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
