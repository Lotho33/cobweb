name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build, e.g. v1.2.0"
        required: true
  # Weekly rebuild of the latest tag: the image carries Debian's Chromium,
  # which must keep receiving security updates between releases.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

jobs:
  # GHCR requires an all-lowercase repository path; github.repository
  # preserves the account's actual casing ("Lotho33/cobweb"), which Docker
  # rejects. Computed once here, in its own tiny job, so both the per-arch
  # matrix and the merge job read the same value without recomputing it.
  vars:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.name }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0
      - name: Version from tag
        id: v
        run: |
          if [ "$EVENT" = schedule ]; then
            ref=$(git describe --tags --abbrev=0 --match 'v*.*.*')
          else
            ref="$INPUT_TAG"
            [ -n "$ref" ] || ref="$REF_NAME"
          fi
          case "$ref" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $ref" >&2; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

  # One job per architecture, each on a NATIVE runner (no QEMU) — the
  # linux/arm64 leg used to compile BoringSSL (wreq's TLS backend) plus the
  # whole dependency tree under emulation in a single combined
  # linux/amd64,linux/arm64 build, which is what made a release take
  # ~1h15m. GitHub's own arm64-hosted runners (public repos, free) removed
  # the emulation penalty entirely — this was flagged as a TODO in this
  # file ("move to native arm runners... once it's worth it") since before
  # it was ever painful; a 1h15m release makes it worth it now.
  #
  # Each leg pushes its image BY DIGEST ONLY (no tag yet) and uploads that
  # digest as an artifact — the standard docker/build-push-action pattern
  # for distributing a multi-platform build across runners. The `merge` job
  # below stitches the digests into one multi-arch manifest under the real
  # tags.
  build:
    needs: vars
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.vars.outputs.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ needs.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitches the per-arch digests into one multi-arch manifest under the
  # real tags (version + latest), then cuts the GitHub Release.
  merge:
    needs: [vars, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ needs.vars.outputs.image }}
          tags: |
            type=raw,value=${{ needs.vars.outputs.version }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=$(printf '${{ needs.vars.outputs.image }}@sha256:%s ' *)
          docker buildx imagetools create $tags $digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect
        run: docker buildx imagetools inspect ${{ needs.vars.outputs.image }}:${{ needs.vars.outputs.version }}

      - name: GitHub Release
        if: github.event_name != 'schedule'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.vars.outputs.ref }}
          generate_release_notes: true
          body: |
            Container image:

            ```
            docker pull ${{ needs.vars.outputs.image }}:${{ needs.vars.outputs.version }}
            ```

            Also tagged `${{ needs.vars.outputs.image }}:latest`. Platforms: `linux/amd64`, `linux/arm64`.
