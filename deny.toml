# cargo-deny config — https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check          (CI runs it with --all-features)

[advisories]
version = 2
yanked = "deny"
ignore = [
    # async-std is discontinued. It reaches the graph ONLY through
    # `chromiumoxide` (async-tungstenite 0.27), which is the off-by-default
    # `chromiumoxide` feature — a legacy fallback browser engine that shipped
    # images never enable (the hand-rolled CDP client is the default from M2,
    # see DESIGN.md §3). No fix is available upstream until chromiumoxide drops
    # async-std. Re-check when the `chromiumoxide` feature is removed.
    "RUSTSEC-2025-0052",
]

[licenses]
version = 2
# Every compiled-in dependency must resolve to one of these. See NOTICE for the
# human-readable attribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# chromiumoxide is an optional, off-by-default fallback engine — its dep subtree
# is allowed to bring duplicates it needs.
skip-tree = [{ name = "chromiumoxide" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
