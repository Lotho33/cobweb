# cargo-deny config — https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check          (CI runs it with --all-features)

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2025-0052 (async-std discontinued) previously required an ignore
# here — it only ever reached the graph through the `chromiumoxide` feature
# (a fallback browser engine that was evaluated during design, DESIGN.md §3,
# but never implemented and has since been removed along with the feature
# flag and its dependency). No ignores needed now; re-add one if a future
# dependency ever pulls async-std back in.
ignore = []

[licenses]
version = 2
# Every compiled-in dependency must resolve to one of these. See NOTICE for the
# human-readable attribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
